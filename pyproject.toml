[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crispr-analysis-suite"
version = "1.0.0"
description = "A comprehensive suite for CRISPR gRNA design, primer design, and indel analysis"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
maintainers = [
    {name = "Your Name", email = "your.email@example.com"},
]
keywords = ["crispr", "grna", "primer-design", "indel-analysis", "bioinformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "biopython>=1.79",
    "scipy>=1.7.0",
    "scikit-learn>=0.24.0",
    "requests>=2.26.0",
    "primer3-py>=0.6.0",
    "streamlit>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.9",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
]

[project.scripts]
# GUI entry point
crispr-gui = "crispr_gui:cli_entry"
# CLI entry points
crispr-find-grna = "find_grna:main"
crispr-design-primers = "design_primers:main"
crispr-analyze = "run_analysis:main"

[project.urls]
Homepage = "https://github.com/yourusername/crispr-analysis-suite"
Documentation = "https://crispr-analysis-suite.readthedocs.io"
Repository = "https://github.com/yourusername/crispr-analysis-suite"
Issues = "https://github.com/yourusername/crispr-analysis-suite/issues"

[tool.setuptools]
packages = ["src", "src.utils", "src.grna_design", "src.grna_design.core", "src.grna_design.database", "src.grna_design.scoring"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md", "*.json", "*.bat"] 
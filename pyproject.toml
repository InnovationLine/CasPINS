[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caspins"
version = "1.0.0"
description = "CasPINS: An integrated platform for CRISPR/TALEN gRNA design, primer design, and indel analysis"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Rinki Dasgupta", email = "rinkidsgpt@gmail.com"},
    {name = "Kaushik Das", email = "kaushik.k.das@gmail.com"},
]
maintainers = [
    {name = "Rinki Dasgupta", email = "rinkidsgpt@gmail.com"},
    {name = "Kaushik Das", email = "kaushik.k.das@gmail.com"},
]
keywords = ["crispr", "talen", "grna", "primer-design", "indel-analysis", "bioinformatics", "genome-editing", "caspins"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "biopython>=1.79",
    "scipy>=1.7.0",
    "scikit-learn>=0.24.0",
    "requests>=2.26.0",
    "primer3-py>=2.0.0",
    "streamlit>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.9",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
]

[project.scripts]
# GUI entry point
caspins-gui = "caspins_gui:cli_entry"
# CLI entry points
caspins-grna = "find_grna:main"
caspins-primers = "design_primers:main"
caspins-analyze = "run_analysis:main"

[project.urls]
Homepage = "https://github.com/InnovationLine/CasPINS"
Documentation = "https://github.com/InnovationLine/CasPINS#readme"
Repository = "https://github.com/InnovationLine/CasPINS"
Issues = "https://github.com/InnovationLine/CasPINS/issues"

[tool.setuptools]
packages = ["src", "src.utils", "src.grna_design", "src.grna_design.core", "src.grna_design.database", "src.grna_design.scoring"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md", "*.json", "*.bat"] 